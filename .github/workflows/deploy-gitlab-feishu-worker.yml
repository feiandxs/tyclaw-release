name: Deploy GitLab Feishu Worker

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "GitLab branch to deploy"
        required: false
        default: "main"
      sha:
        description: "Optional GitLab commit SHA to deploy. When set, it overrides branch HEAD."
        required: false
        default: ""

concurrency:
  group: deploy-gitlab-feishu-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve deploy inputs
        id: ref
        shell: bash
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          SHA="${{ github.event.inputs.sha }}"

          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved branch: $BRANCH"
          echo "Resolved sha: ${SHA:-<none>}"

      - name: Validate required secrets
        shell: bash
        env:
          GITLAB_DEPLOY_TOKEN_USER: ${{ secrets.GITLAB_DEPLOY_TOKEN_USER }}
          GITLAB_DEPLOY_TOKEN_PASS: ${{ secrets.GITLAB_DEPLOY_TOKEN_PASS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITLAB_WEBHOOK_SIGNING_TOKEN: ${{ secrets.GITLAB_WEBHOOK_SIGNING_TOKEN }}
        run: |
          for name in \
            GITLAB_DEPLOY_TOKEN_USER \
            GITLAB_DEPLOY_TOKEN_PASS \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            GITLAB_WEBHOOK_SIGNING_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Clone source from GitLab
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.ref.outputs.branch }}" \
            "https://${{ secrets.GITLAB_DEPLOY_TOKEN_USER }}:${{ secrets.GITLAB_DEPLOY_TOKEN_PASS }}@gitlab.apexdata.com.cn/ty/triomate.git" \
            source

      - name: Checkout exact SHA
        if: ${{ steps.ref.outputs.sha != '' }}
        working-directory: source
        shell: bash
        run: |
          git fetch --depth 1 origin "${{ steps.ref.outputs.sha }}"
          git checkout --detach FETCH_HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.1

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile --filter gitlab-feishu-worker...

      - name: Verify worker
        working-directory: source
        run: |
          pnpm --filter gitlab-feishu-worker test
          pnpm --filter gitlab-feishu-worker typecheck

      - name: Deploy worker
        working-directory: source/apps/gitlab-feishu-worker
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITLAB_WEBHOOK_SIGNING_TOKEN: ${{ secrets.GITLAB_WEBHOOK_SIGNING_TOKEN }}
        run: |
          secrets_file="$RUNNER_TEMP/gitlab-feishu-worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg token "$GITLAB_WEBHOOK_SIGNING_TOKEN" \
            '{GITLAB_WEBHOOK_SIGNING_TOKEN: $token}' > "$secrets_file"
          chmod 600 "$secrets_file"
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
