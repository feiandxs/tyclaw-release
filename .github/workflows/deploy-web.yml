name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character GitLab commit SHA to deploy"
        required: true
        type: string
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-web-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Validate deploy inputs
        id: ref
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.inputs.sha }}
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be a full 40-character lowercase Git commit SHA" >&2
            exit 1
          fi

          case "$DEPLOY_ENVIRONMENT" in
            production) ;;
            *)
              echo "Unsupported environment: $DEPLOY_ENVIRONMENT" >&2
              exit 1
              ;;
          esac

          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "environment=$DEPLOY_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "Deploy SHA: $DEPLOY_SHA"
          echo "Deploy environment: $DEPLOY_ENVIRONMENT"

      - name: Validate required secrets
        shell: bash
        env:
          API_DEPLOY_HOST: ${{ secrets.API_DEPLOY_HOST }}
          API_DEPLOY_USER: ${{ secrets.API_DEPLOY_USER }}
          API_DEPLOY_PATH: ${{ secrets.API_DEPLOY_PATH }}
          API_DEPLOY_SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in API_DEPLOY_HOST API_DEPLOY_USER API_DEPLOY_PATH API_DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Prepare SSH client
        shell: bash
        env:
          API_DEPLOY_HOST: ${{ secrets.API_DEPLOY_HOST }}
          API_DEPLOY_PORT: ${{ secrets.API_DEPLOY_PORT }}
          API_DEPLOY_SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
          API_DEPLOY_KNOWN_HOSTS: ${{ secrets.API_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$API_DEPLOY_SSH_KEY" > ~/.ssh/api_deploy_key
          chmod 600 ~/.ssh/api_deploy_key

          if [ -n "$API_DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$API_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${API_DEPLOY_PORT:-22}" "$API_DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy Web on remote host
        shell: bash
        env:
          API_DEPLOY_HOST: ${{ secrets.API_DEPLOY_HOST }}
          API_DEPLOY_PORT: ${{ secrets.API_DEPLOY_PORT }}
          API_DEPLOY_USER: ${{ secrets.API_DEPLOY_USER }}
          API_DEPLOY_PATH: ${{ secrets.API_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/api_deploy_key \
            -p "${API_DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            "${API_DEPLOY_USER}@${API_DEPLOY_HOST}" \
            "DEPLOY_PATH='${API_DEPLOY_PATH}' DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'EOF'
          set -euo pipefail

          # 生产 web 已迁 k3s（ty/triomate#3606）：不再执行任何 docker-compose 命令。
          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "Deploy path does not contain a git checkout: $DEPLOY_PATH" >&2
            exit 1
          fi
          if ! sudo -n k3s --version >/dev/null 2>&1; then
            echo "sudo -n k3s is required on the remote host" >&2
            exit 1
          fi

          cd "$DEPLOY_PATH"
          origin_url="$(git remote get-url origin)"
          case "$origin_url" in
            *gitlab.apexdata.com.cn*ty/tyclaw*)
              git remote set-url origin "${origin_url/ty\/tyclaw/ty\/triomate}"
              ;;
          esac

          git fetch --depth 1 origin "$DEPLOY_SHA"
          if [ "$(git rev-parse FETCH_HEAD)" != "$DEPLOY_SHA" ]; then
            echo "Fetched commit does not match requested SHA" >&2
            exit 1
          fi

          NS=web
          DEPLOY=web
          IMG="100.64.0.8:8443/triomate/web:linux-amd64-${DEPLOY_SHA}"
          MANIFEST=/etc/rancher/k3s/manifests-manual/web.yaml
          PREV_IMG="$(sudo -n k3s kubectl -n "$NS" get deploy/"$DEPLOY" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "Current image: $PREV_IMG"
          echo "Target image:  $IMG"

          # 生产机通过 k3s 配置的 Harbor 镜像源拉取 GitLab CI 构建产物
          if ! sudo -n k3s crictl pull "$IMG"; then
            echo "ERROR: image $IMG is unavailable; run the GitLab web:publish-amd64 job for SHA $DEPLOY_SHA first" >&2
            exit 1
          fi
          # 生产 Deployment 一律按 digest 固定（ty/triomate#3673、#3680）：Harbor tag 可移动，tag 引用不可靠。
          IMG_REPO="${IMG%:*}"
          IMG_DIGEST="$(sudo -n k3s crictl inspecti -o json "$IMG" | jq -r --arg p "${IMG_REPO}@sha256:" '[.status.repoDigests[] | select(startswith($p))] | if length == 1 then .[0] else empty end')"
          if ! [[ "$IMG_DIGEST" =~ ^${IMG_REPO//./\\.}@sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: cannot resolve a unique Harbor digest for $IMG" >&2
            exit 1
          fi
          echo "Resolved $IMG -> $IMG_DIGEST"
          IMG="$IMG_DIGEST"

          health_check() {
            for attempt in $(seq 1 30); do
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8083/login || true)"
              if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 500 ]; then
                echo "Health check passed on attempt $attempt"
                return 0
              fi
              echo "Health check attempt $attempt/30 failed, waiting 2s..."
              sleep 2
            done
            return 1
          }

          rollback() {
            local status=$?
            trap - ERR
            sudo -n k3s kubectl -n "$NS" logs deploy/"$DEPLOY" --tail=200 || true
            echo "Deployment failed; rolling back to $PREV_IMG" >&2
            sudo -n k3s kubectl -n "$NS" rollout undo deploy/"$DEPLOY" || true
            sudo -n k3s kubectl -n "$NS" rollout status deploy/"$DEPLOY" --timeout=300s || true
            exit "$status"
          }
          trap rollback ERR

          sudo -n k3s kubectl -n "$NS" patch deploy/"$DEPLOY" --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"web","imagePullPolicy":"IfNotPresent"}]}}}}'
          sudo -n k3s kubectl -n "$NS" set image deploy/"$DEPLOY" web="$IMG"
          sudo -n k3s kubectl -n "$NS" rollout status deploy/"$DEPLOY" --timeout=300s
          health_check

          # 只允许监听回环地址（清单 args: pnpm start -H 127.0.0.1）
          listeners="$(ss -ltnH 'sport = :8083' | awk '{print $4}')"
          echo "Listeners on 8083: $listeners"
          if [ -z "$listeners" ] || printf '%s\n' "$listeners" | grep -vqE '^127\.0\.0\.1:8083$'; then
            echo "web listens on a non-loopback address (or not at all)" >&2
            false
          fi
          trap - ERR

          sudo -n k3s kubectl -n "$NS" annotate deploy/"$DEPLOY" --overwrite triomate.ai/source-sha="$DEPLOY_SHA" kubernetes.io/change-cause="tyclaw-release deploy-web sha=$DEPLOY_SHA (ty/triomate#3680)"
          sudo -n /usr/local/sbin/harbor-run-tag prod "$DEPLOY" "$IMG" || echo "::warning::harbor-run-tag failed for $DEPLOY; run/prev tags not updated"

          # 同步磁盘清单中的镜像，避免与运行态漂移（清单不会被自动 apply）
          image_pattern='(registry\.apexdata\.com\.cn/ty/triomate|100\.64\.0\.8:8443/triomate)/web(:[^"[:space:]]+|@sha256:[[:xdigit:]]{64})'
          if sudo -n test -f "$MANIFEST" && [ "$(sudo -n grep -cE "$image_pattern" "$MANIFEST")" = "1" ]; then
            sudo -n cp -a "$MANIFEST" "$MANIFEST.before-$(date +%Y%m%d-%H%M%S)"
            sudo -n sed -i -E "s#(image: *\"?)(registry\.apexdata\.com\.cn/ty/triomate|100\.64\.0\.8:8443/triomate)/web(:[^\"[:space:]]+|@sha256:[[:xdigit:]]{64})#\1${IMG}#" "$MANIFEST"
            sudo -n sed -i -E "/^[[:space:]]*image: .*triomate\/web(:|@)/,/^[[:space:]]*image:/ s#^([[:space:]]*imagePullPolicy: *)Never#\1IfNotPresent#" "$MANIFEST"
            sudo -n grep -nE 'triomate/web(:|@)' "$MANIFEST"
            if [ "$(sudo -n grep -cF "$IMG" "$MANIFEST")" != "1" ]; then
              echo "ERROR: $MANIFEST image line was not updated to $IMG" >&2
              exit 1
            fi
          else
            # 服务已发布并验证通过，这里只让 job 失败标红，不回退
            echo "ERROR: $MANIFEST not updated (missing, unreadable or unexpected image lines); service is deployed, fix manifest drift by hand" >&2
            exit 1
          fi
          sudo -n k3s kubectl -n "$NS" get pods -o wide
          EOF

      - name: Summarize deployment
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
          DEPLOY_ENVIRONMENT: ${{ steps.ref.outputs.environment }}
        run: |
          {
            echo "## Web deployment (k3s)"
            echo
            echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
            echo "- GitLab SHA: \`$DEPLOY_SHA\`"
            echo "- Health: /login < 500; listens on 127.0.0.1:8083 only"
          } >> "$GITHUB_STEP_SUMMARY"
