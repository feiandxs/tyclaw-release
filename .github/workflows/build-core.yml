# Build Core Runtime Release
#
# 独立构建并发布 tailos-core（Rust runtime）的预编译二进制。
# 与 build-desktop.yml 解耦：源码在私有 GitLab（ty/tailos-core），
# 产物发布到本 public GitHub 仓库的 Release（任何人/CI 无需 token 直链下载）。
#
# 产物集（每平台一个归档 + .sha256 旁证）：
#   - macOS x64 / arm64 : tailos, tailos-python-shim
#   - Windows x64       : tailos.exe, tailos-python-shim.exe,
#                         tailos-command-runner.exe, tailos-windows-sandbox-setup.exe
#
# 触发：手动 workflow_dispatch（version + os），或 repository_dispatch（GitLab CI 远程触发）。
# Release tag：runtime-v<version>（独立前缀，避免与桌面发布 tag 撞车）。

name: Build Core Runtime Release

# 发布 GitHub Release 需要写 contents 权限（默认 GITHUB_TOKEN 可能是只读）。
permissions:
  contents: write

on:
  repository_dispatch:
    types: [build-core-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Runtime version, e.g. 0.1.0 (tag = runtime-v<version>)"
        required: true
        type: string
      ref:
        description: "tailos-core git ref/tag to build (optional, default branch HEAD)"
        required: false
        type: string
      os:
        description: "Target os-platform build"
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-x64
          - macos-arm64
          - windows-x64

env:
  GITLAB_RUNTIME_REPO: "gitlab.apexdata.com.cn/ty/tailos-core.git"

jobs:
  # ---------------------------------------------------------------------------
  build-core-mac-x64:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.os == 'all' || github.event.inputs.os == 'macos-x64')) ||
        (github.event_name == 'repository_dispatch' && (github.event.client_payload.os == '' || github.event.client_payload.os == 'all' || github.event.client_payload.os == 'macos-x64'))
      }}
    runs-on: macos-15-intel
    steps:
      - name: Resolve inputs
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.client_payload.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone tailos-core from GitLab
        run: |
          REPO_URL="https://${{ secrets.GITLAB_CORE_TOKEN_USER }}:${{ secrets.GITLAB_CORE_TOKEN_PASS }}@${{ env.GITLAB_RUNTIME_REPO }}"
          REF="${{ steps.vars.outputs.ref }}"
          if [ -n "$REF" ]; then
            git clone --depth 1 --branch "$REF" "$REPO_URL" source
          else
            git clone --depth 1 "$REPO_URL" source
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # 注：tailos-core 自带 rust-toolchain.toml（锁 1.94.1），
        # 在 source/ 内执行 cargo 时 rustup 会自动安装并使用该版本。

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-core
          key: ${{ runner.arch }}
          cache-bin: "false"
          workspaces: |
            source -> target

      - name: Build runtime (mac x64)
        working-directory: source
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release -p tailos-cli --bins --target x86_64-apple-darwin
          STAGE="$GITHUB_WORKSPACE/stage"
          mkdir -p "$STAGE"
          cp target/x86_64-apple-darwin/release/tailos "$STAGE/"
          cp target/x86_64-apple-darwin/release/tailos-python-shim "$STAGE/"
          chmod +x "$STAGE"/tailos "$STAGE"/tailos-python-shim
          file "$STAGE"/*

      - name: Package + checksum
        id: pkg
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          ASSET="tailos-runtime-${VERSION}-darwin-x64.tar.gz"
          tar -czf "$ASSET" -C stage .
          shasum -a 256 "$ASSET" | tee "${ASSET}.sha256"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-v${{ steps.vars.outputs.version }}
          name: Runtime v${{ steps.vars.outputs.version }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256

  # ---------------------------------------------------------------------------
  build-core-mac-arm64:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.os == 'all' || github.event.inputs.os == 'macos-arm64')) ||
        (github.event_name == 'repository_dispatch' && (github.event.client_payload.os == '' || github.event.client_payload.os == 'all' || github.event.client_payload.os == 'macos-arm64'))
      }}
    runs-on: macos-latest
    steps:
      - name: Resolve inputs
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.client_payload.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone tailos-core from GitLab
        run: |
          REPO_URL="https://${{ secrets.GITLAB_CORE_TOKEN_USER }}:${{ secrets.GITLAB_CORE_TOKEN_PASS }}@${{ env.GITLAB_RUNTIME_REPO }}"
          REF="${{ steps.vars.outputs.ref }}"
          if [ -n "$REF" ]; then
            git clone --depth 1 --branch "$REF" "$REPO_URL" source
          else
            git clone --depth 1 "$REPO_URL" source
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-core
          key: ${{ runner.arch }}
          cache-bin: "false"
          workspaces: |
            source -> target

      - name: Build runtime (mac arm64)
        working-directory: source
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release -p tailos-cli --bins --target aarch64-apple-darwin
          STAGE="$GITHUB_WORKSPACE/stage"
          mkdir -p "$STAGE"
          cp target/aarch64-apple-darwin/release/tailos "$STAGE/"
          cp target/aarch64-apple-darwin/release/tailos-python-shim "$STAGE/"
          chmod +x "$STAGE"/tailos "$STAGE"/tailos-python-shim
          file "$STAGE"/*

      - name: Package + checksum
        id: pkg
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          ASSET="tailos-runtime-${VERSION}-darwin-arm64.tar.gz"
          tar -czf "$ASSET" -C stage .
          shasum -a 256 "$ASSET" | tee "${ASSET}.sha256"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-v${{ steps.vars.outputs.version }}
          name: Runtime v${{ steps.vars.outputs.version }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256

  # ---------------------------------------------------------------------------
  build-core-win:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.os == 'all' || github.event.inputs.os == 'windows-x64')) ||
        (github.event_name == 'repository_dispatch' && (github.event.client_payload.os == '' || github.event.client_payload.os == 'all' || github.event.client_payload.os == 'windows-x64'))
      }}
    runs-on: windows-latest
    steps:
      - name: Resolve inputs
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.client_payload.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone tailos-core from GitLab
        shell: bash
        run: |
          REPO_URL="https://${{ secrets.GITLAB_CORE_TOKEN_USER }}:${{ secrets.GITLAB_CORE_TOKEN_PASS }}@${{ env.GITLAB_RUNTIME_REPO }}"
          REF="${{ steps.vars.outputs.ref }}"
          if [ -n "$REF" ]; then
            git clone --depth 1 --branch "$REF" "$REPO_URL" source
          else
            git clone --depth 1 "$REPO_URL" source
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-core
          key: ${{ runner.arch }}
          cache-bin: "false"
          workspaces: |
            source -> target

      - name: Build runtime (win x64)
        working-directory: source
        shell: bash
        run: |
          # 主 CLI 二进制
          cargo build --release -p tailos-cli --bins
          # Windows 沙箱辅助 bin（独立 package，不在主 workspace）
          cargo build --release \
            --manifest-path vendor/codex-windows-sandbox/Cargo.toml \
            --target-dir target \
            --bin tailos-command-runner --bin tailos-windows-sandbox-setup
          STAGE="$GITHUB_WORKSPACE/stage"
          mkdir -p "$STAGE"
          cp target/release/tailos.exe                       "$STAGE/"
          cp target/release/tailos-python-shim.exe           "$STAGE/"
          cp target/release/tailos-command-runner.exe        "$STAGE/"
          cp target/release/tailos-windows-sandbox-setup.exe "$STAGE/"
          ls -l "$STAGE"

      - name: Package + checksum
        id: pkg
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          ASSET="tailos-runtime-${VERSION}-win32-x64.zip"
          ( cd stage && 7z a -tzip "../$ASSET" ./* )
          certutil -hashfile "$ASSET" SHA256 | sed -n '2p' | tr -d ' \r' | tee "${ASSET}.sha256"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-v${{ steps.vars.outputs.version }}
          name: Runtime v${{ steps.vars.outputs.version }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
