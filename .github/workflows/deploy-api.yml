name: Deploy API Gateway

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "GitLab branch to deploy"
        required: false
        default: "main"
      sha:
        description: "Optional GitLab commit SHA to deploy. When set, it overrides branch HEAD."
        required: false
        default: ""
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-api-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Resolve deploy inputs
        id: ref
        shell: bash
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          SHA="${{ github.event.inputs.sha }}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"

          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi

          if [ -z "$ENVIRONMENT" ]; then
            ENVIRONMENT="production"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "Resolved branch: $BRANCH"
          echo "Resolved sha: ${SHA:-<none>}"
          echo "Resolved environment: $ENVIRONMENT"

      - name: Validate required secrets
        shell: bash
        env:
          API_DEPLOY_HOST: ${{ secrets.API_DEPLOY_HOST }}
          API_DEPLOY_USER: ${{ secrets.API_DEPLOY_USER }}
          API_DEPLOY_PATH: ${{ secrets.API_DEPLOY_PATH }}
          API_DEPLOY_SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
        run: |
          for name in API_DEPLOY_HOST API_DEPLOY_USER API_DEPLOY_PATH API_DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Prepare SSH client
        shell: bash
        env:
          API_DEPLOY_HOST: ${{ secrets.API_DEPLOY_HOST }}
          API_DEPLOY_PORT: ${{ secrets.API_DEPLOY_PORT }}
          API_DEPLOY_SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
          API_DEPLOY_KNOWN_HOSTS: ${{ secrets.API_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$API_DEPLOY_SSH_KEY" > ~/.ssh/api_deploy_key
          chmod 600 ~/.ssh/api_deploy_key

          if [ -n "$API_DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$API_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${API_DEPLOY_PORT:-22}" "$API_DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy API on remote host
        shell: bash
        env:
          API_DEPLOY_HOST: ${{ secrets.API_DEPLOY_HOST }}
          API_DEPLOY_PORT: ${{ secrets.API_DEPLOY_PORT }}
          API_DEPLOY_USER: ${{ secrets.API_DEPLOY_USER }}
          API_DEPLOY_PATH: ${{ secrets.API_DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ steps.ref.outputs.branch }}
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          ssh \
            -i ~/.ssh/api_deploy_key \
            -p "${API_DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            "${API_DEPLOY_USER}@${API_DEPLOY_HOST}" \
            "DEPLOY_PATH='${API_DEPLOY_PATH}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'EOF'
          set -euo pipefail

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "Deploy path does not contain a git checkout: $DEPLOY_PATH" >&2
            exit 1
          fi

          cd "$DEPLOY_PATH"

          # 生产 api-gateway 已迁 k3s（ty/triomate#3599、#3601）：不再执行任何 docker-compose 命令，不碰 pg。
          if ! sudo -n k3s --version >/dev/null 2>&1; then
            echo "sudo -n k3s is required on the remote host" >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Deploy path has tracked local changes: $DEPLOY_PATH" >&2
            echo "Refusing to deploy over a dirty working tree." >&2
            git status --short --untracked-files=no
            exit 1
          fi

          origin_url="$(git remote get-url origin)"
          case "$origin_url" in
            *gitlab.apexdata.com.cn*ty/tyclaw*)
              git remote set-url origin "${origin_url/ty\/tyclaw/ty\/triomate}"
              ;;
          esac

          if [ -n "$DEPLOY_SHA" ]; then
            echo "Deploying exact SHA: $DEPLOY_SHA"
            git fetch --depth 1 origin "$DEPLOY_SHA"
          else
            echo "Deploying branch head: $DEPLOY_BRANCH"
            git fetch --depth 1 origin "$DEPLOY_BRANCH"
          fi
          git checkout --detach FETCH_HEAD
          SHA="$(git rev-parse HEAD)"

          NS=api-gateway
          IMG="100.64.0.8:8443/triomate/api-gateway:linux-amd64-${SHA}"
          MANIFEST=/etc/rancher/k3s/manifests-manual/api-gateway.yaml
          PREV_IMG="$(sudo -n k3s kubectl -n "$NS" get deploy/api-gateway -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "Current image: $PREV_IMG"
          echo "Target image:  $IMG"

          # 生产机通过 k3s 配置的 Harbor 镜像源拉取 GitLab CI 构建产物
          if ! sudo -n k3s crictl pull "$IMG"; then
            echo "ERROR: image $IMG is unavailable; run the GitLab api-gateway:publish-amd64 job for SHA $SHA first" >&2
            exit 1
          fi
          sudo -n k3s crictl inspecti "$IMG" >/dev/null

          sudo -n k3s kubectl -n "$NS" patch deploy/api-gateway --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"api-gateway","imagePullPolicy":"IfNotPresent"}]}}}}'
          sudo -n k3s kubectl -n "$NS" set image deploy/api-gateway api-gateway="$IMG"
          if ! sudo -n k3s kubectl -n "$NS" rollout status deploy/api-gateway --timeout=300s; then
            sudo -n k3s kubectl -n "$NS" logs deploy/api-gateway --tail=200 || true
            echo "Rollout failed; rolling back to $PREV_IMG" >&2
            sudo -n k3s kubectl -n "$NS" rollout undo deploy/api-gateway
            sudo -n k3s kubectl -n "$NS" rollout status deploy/api-gateway --timeout=300s || true
            exit 1
          fi

          health_ok=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8182/health; then
              echo
              echo "Health check passed on attempt $attempt"
              health_ok=true
              break
            fi

            echo "Health check attempt $attempt/30 failed, waiting 2s..."
            sleep 2
          done

          if [ "$health_ok" != "true" ]; then
            sudo -n k3s kubectl -n "$NS" logs deploy/api-gateway --tail=200 || true
            exit 1
          fi

          sudo -n /usr/local/sbin/harbor-run-tag prod api-gateway "$IMG" || echo "::warning::harbor-run-tag failed for api-gateway; run/prev tags not updated"

          # 同步磁盘清单中的镜像，避免与运行态漂移（清单不会被自动 apply）
          image_pattern='(registry\.apexdata\.com\.cn/ty/triomate|100\.64\.0\.8:8443/triomate)/api-gateway(:[^"[:space:]]+|@sha256:[[:xdigit:]]{64})'
          if sudo -n test -f "$MANIFEST" && [ "$(sudo -n grep -cE "$image_pattern" "$MANIFEST")" = "1" ]; then
            sudo -n cp -a "$MANIFEST" "$MANIFEST.before-$(date +%Y%m%d-%H%M%S)"
            sudo -n sed -i -E "s#(image: *\"?)(registry\.apexdata\.com\.cn/ty/triomate|100\.64\.0\.8:8443/triomate)/api-gateway(:[^\"[:space:]]+|@sha256:[[:xdigit:]]{64})#\1${IMG}#" "$MANIFEST"
            sudo -n sed -i -E "/^[[:space:]]*image: .*triomate\/api-gateway(:|@)/,/^[[:space:]]*image:/ s#^([[:space:]]*imagePullPolicy: *)Never#\1IfNotPresent#" "$MANIFEST"
            sudo -n grep -nE 'triomate/api-gateway(:|@)' "$MANIFEST"
            if [ "$(sudo -n grep -cF "$IMG" "$MANIFEST")" != "1" ]; then
              echo "ERROR: $MANIFEST image line was not updated to $IMG" >&2
              exit 1
            fi
          else
            # 服务已发布并验证通过，这里只让 job 失败标红，不回退
            echo "ERROR: $MANIFEST not updated (missing, unreadable or unexpected image lines); service is deployed, fix manifest drift by hand" >&2
            exit 1
          fi
          EOF
