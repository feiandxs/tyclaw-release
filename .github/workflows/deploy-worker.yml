name: Deploy Download Worker

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "GitLab branch to deploy"
        required: false
        default: "main"
      sha:
        description: "Optional GitLab commit SHA to deploy. When set, it overrides branch HEAD."
        required: false
        default: ""

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve deploy inputs
        id: ref
        shell: bash
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          SHA="${{ github.event.inputs.sha }}"

          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved branch: $BRANCH"
          echo "Resolved sha: ${SHA:-<none>}"

      - name: Clone source from GitLab
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.ref.outputs.branch }}" \
            "https://${{ secrets.GITLAB_DEPLOY_TOKEN_USER }}:${{ secrets.GITLAB_DEPLOY_TOKEN_PASS }}@gitlab.apexdata.com.cn/ty/tyclaw.git" \
            source

      - name: Checkout exact SHA
        if: ${{ steps.ref.outputs.sha != '' }}
        working-directory: source
        shell: bash
        run: |
          git fetch --depth 1 origin "${{ steps.ref.outputs.sha }}"
          git checkout "${{ steps.ref.outputs.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.1.1

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile --filter download-worker...

      - name: Deploy download worker
        working-directory: source/apps/download-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
