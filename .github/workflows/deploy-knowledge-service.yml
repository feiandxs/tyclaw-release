name: Deploy Knowledge Service

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character GitLab commit SHA to deploy"
        required: true
        type: string
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-knowledge-service-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Validate deploy inputs
        id: ref
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.inputs.sha }}
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be a full 40-character lowercase Git commit SHA" >&2
            exit 1
          fi

          case "$DEPLOY_ENVIRONMENT" in
            production) ;;
            *)
              echo "Unsupported environment: $DEPLOY_ENVIRONMENT" >&2
              exit 1
              ;;
          esac

          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "environment=$DEPLOY_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "Deploy SHA: $DEPLOY_SHA"
          echo "Deploy environment: $DEPLOY_ENVIRONMENT"

      - name: Validate required secrets
        shell: bash
        env:
          API_DEPLOY_HOST: ${{ secrets.API_DEPLOY_HOST }}
          API_DEPLOY_USER: ${{ secrets.API_DEPLOY_USER }}
          API_DEPLOY_PATH: ${{ secrets.API_DEPLOY_PATH }}
          API_DEPLOY_SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in API_DEPLOY_HOST API_DEPLOY_USER API_DEPLOY_PATH API_DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Prepare SSH client
        shell: bash
        env:
          API_DEPLOY_HOST: ${{ secrets.API_DEPLOY_HOST }}
          API_DEPLOY_PORT: ${{ secrets.API_DEPLOY_PORT }}
          API_DEPLOY_SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
          API_DEPLOY_KNOWN_HOSTS: ${{ secrets.API_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$API_DEPLOY_SSH_KEY" > ~/.ssh/api_deploy_key
          chmod 600 ~/.ssh/api_deploy_key

          if [ -n "$API_DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$API_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${API_DEPLOY_PORT:-22}" "$API_DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy Knowledge Service on remote host
        shell: bash
        env:
          API_DEPLOY_HOST: ${{ secrets.API_DEPLOY_HOST }}
          API_DEPLOY_PORT: ${{ secrets.API_DEPLOY_PORT }}
          API_DEPLOY_USER: ${{ secrets.API_DEPLOY_USER }}
          API_DEPLOY_PATH: ${{ secrets.API_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/api_deploy_key \
            -p "${API_DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=yes \
            "${API_DEPLOY_USER}@${API_DEPLOY_HOST}" \
            "DEPLOY_PATH='${API_DEPLOY_PATH}' DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'EOF'
          set -euo pipefail

          # 生产 knowledge-service 已迁 k3s（ty/triomate#3603）：不再执行任何 docker-compose 命令。
          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "Deploy path does not contain a git checkout: $DEPLOY_PATH" >&2
            exit 1
          fi
          if ! sudo -n k3s --version >/dev/null 2>&1; then
            echo "sudo -n k3s is required on the remote host" >&2
            exit 1
          fi

          cd "$DEPLOY_PATH"
          origin_url="$(git remote get-url origin)"
          case "$origin_url" in
            *gitlab.apexdata.com.cn*ty/tyclaw*)
              git remote set-url origin "${origin_url/ty\/tyclaw/ty\/triomate}"
              ;;
          esac

          git fetch --depth 1 origin "$DEPLOY_SHA"
          if [ "$(git rev-parse FETCH_HEAD)" != "$DEPLOY_SHA" ]; then
            echo "Fetched commit does not match requested SHA" >&2
            exit 1
          fi

          NS=knowledge
          DEPLOY=knowledge-service
          IMG="100.64.0.8:8443/triomate/knowledge-service:linux-amd64-${DEPLOY_SHA}"
          MANIFEST=/etc/rancher/k3s/manifests-manual/knowledge.yaml
          PREV_IMG="$(sudo -n k3s kubectl -n "$NS" get deploy/"$DEPLOY" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "Current image: $PREV_IMG"
          echo "Target image:  $IMG"

          # 生产机通过 k3s 配置的 Harbor 镜像源拉取 GitLab CI 构建产物
          if ! sudo -n k3s crictl pull "$IMG"; then
            echo "ERROR: image $IMG is unavailable; run the GitLab knowledge-service:publish-amd64 job for SHA $DEPLOY_SHA first" >&2
            exit 1
          fi
          sudo -n k3s crictl inspecti "$IMG" >/dev/null

          health_check() {
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3207/health >/dev/null; then
                echo "Health check passed on attempt $attempt"
                return 0
              fi
              echo "Health check attempt $attempt/30 failed, waiting 2s..."
              sleep 2
            done
            return 1
          }

          rollback() {
            local status=$?
            trap - ERR
            sudo -n k3s kubectl -n "$NS" logs deploy/"$DEPLOY" --tail=200 || true
            echo "Deployment failed; rolling back to $PREV_IMG" >&2
            sudo -n k3s kubectl -n "$NS" rollout undo deploy/"$DEPLOY" || true
            sudo -n k3s kubectl -n "$NS" rollout status deploy/"$DEPLOY" --timeout=300s || true
            exit "$status"
          }
          trap rollback ERR

          sudo -n k3s kubectl -n "$NS" patch deploy/"$DEPLOY" --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"knowledge-service","imagePullPolicy":"IfNotPresent"}]}}}}'
          sudo -n k3s kubectl -n "$NS" set image deploy/"$DEPLOY" knowledge-service="$IMG"
          sudo -n k3s kubectl -n "$NS" rollout status deploy/"$DEPLOY" --timeout=300s
          health_check

          # 只允许监听回环地址（LISTEN_HOST=127.0.0.1）
          listeners="$(ss -ltnH 'sport = :3207' | awk '{print $4}')"
          echo "Listeners on 3207: $listeners"
          if printf '%s\n' "$listeners" | grep -vqE '^127\.0\.0\.1:3207$'; then
            echo "knowledge-service listens on a non-loopback address" >&2
            false
          fi

          unauth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3207/documents || true)"
          if [ "$unauth_status" != "401" ]; then
            echo "Unauthenticated documents should return 401, got $unauth_status" >&2
            false
          fi

          knowledge_token="$(sudo -n k3s kubectl -n "$NS" get secret knowledge-env -o jsonpath='{.data.KNOWLEDGE_SERVICE_INTERNAL_TOKEN}' | base64 -d)"
          smoke_response="$(curl --fail --silent --show-error --get \
            -H "Authorization: Bearer $knowledge_token" \
            -H 'X-Knowledge-Tenant-Id: __knowledge_deploy_smoke__' \
            --data-urlencode 'q=__knowledge_deploy_smoke__' \
            --data-urlencode 'collection=__knowledge_deploy_smoke__' \
            --data-urlencode 'limit=1' \
            http://127.0.0.1:3207/search)"
          unset knowledge_token
          if ! printf '%s' "$smoke_response" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
            echo "Knowledge search smoke returned an unexpected response" >&2
            false
          fi
          trap - ERR

          sudo -n k3s kubectl -n "$NS" annotate deploy/"$DEPLOY" --overwrite triomate.ai/source-sha="$DEPLOY_SHA" kubernetes.io/change-cause="tyclaw-release deploy-knowledge-service sha=$DEPLOY_SHA (ty/triomate#3680)"
          sudo -n /usr/local/sbin/harbor-run-tag prod "$DEPLOY" "$IMG" || echo "::warning::harbor-run-tag failed for $DEPLOY; run/prev tags not updated"

          # 同步磁盘清单中的镜像，避免与运行态漂移（清单不会被自动 apply）
          image_pattern='(registry\.apexdata\.com\.cn/ty/triomate|100\.64\.0\.8:8443/triomate)/knowledge-service(:[^"[:space:]]+|@sha256:[[:xdigit:]]{64})'
          if sudo -n test -f "$MANIFEST" && [ "$(sudo -n grep -cE "$image_pattern" "$MANIFEST")" = "1" ]; then
            sudo -n cp -a "$MANIFEST" "$MANIFEST.before-$(date +%Y%m%d-%H%M%S)"
            sudo -n sed -i -E "s#(image: *\"?)(registry\.apexdata\.com\.cn/ty/triomate|100\.64\.0\.8:8443/triomate)/knowledge-service(:[^\"[:space:]]+|@sha256:[[:xdigit:]]{64})#\1${IMG}#" "$MANIFEST"
            sudo -n sed -i -E "/^[[:space:]]*image: .*triomate\/knowledge-service(:|@)/,/^[[:space:]]*image:/ s#^([[:space:]]*imagePullPolicy: *)Never#\1IfNotPresent#" "$MANIFEST"
            sudo -n grep -nE 'triomate/knowledge-service(:|@)' "$MANIFEST"
            if [ "$(sudo -n grep -cF "$IMG" "$MANIFEST")" != "1" ]; then
              echo "ERROR: $MANIFEST image line was not updated to $IMG" >&2
              exit 1
            fi
          else
            # 服务已发布并验证通过，这里只让 job 失败标红，不回退
            echo "ERROR: $MANIFEST not updated (missing, unreadable or unexpected image lines); service is deployed, fix manifest drift by hand" >&2
            exit 1
          fi
          sudo -n k3s kubectl -n "$NS" get pods -o wide
          EOF

      - name: Summarize deployment
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
          DEPLOY_ENVIRONMENT: ${{ steps.ref.outputs.environment }}
        run: |
          {
            echo "## Knowledge Service deployment (k3s)"
            echo
            echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
            echo "- GitLab SHA: \`$DEPLOY_SHA\`"
            echo "- Health: passed; listens on 127.0.0.1:3207 only"
            echo "- Unauthenticated documents: 401"
            echo "- Authenticated search smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"
